# Regera os SVGs do perfil (em especial o diagnóstico) uma vez por dia.
# Só faz commit quando algum número muda: a data do "snapshot" sozinha não conta.

name: diagnostico

on:
  schedule:
    - cron: "17 6 * * *"   # 03:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: [gen.py, art/**]

permissions:
  contents: write

concurrency:
  group: diagnostico
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow (retrato em ASCII)
        run: pip install pillow

      - name: Gerar SVGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python gen.py

      - name: Commit se algo mudou
        run: |
          if git diff --quiet -I 'snapshot [0-9.]*' -- assets; then
            echo "Nada mudou além da data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Atualiza diagnóstico"
          git push
