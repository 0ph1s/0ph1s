<svg xmlns="http://www.w3.org/2000/svg" width="900" height="46" viewBox="0 0 900 46" role="img" aria-label="0ph1s@core:~$ git log --author=0ph1s">
<style>
text { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, Menlo, 'DejaVu Sans Mono', 'Liberation Mono', monospace; }
.dim { fill: #A97B4B; } .amb { fill: #FFB547; } .hot { fill: #FFE6B3; }
.txt { fill: #EBCB98; } .wire { fill: #5A3B1F; } .glass { fill: #120D08; }
.glow { filter: url(#glow); }
.crt { animation: flick 6s steps(1) infinite; }
.blink { animation: blink 1.06s steps(1) infinite; }
.led { animation: led 2.4s steps(1) infinite; }
.a { animation: appear .01s linear both; }
.on { animation: power .5s linear both; }
.roll { animation: roll 8s linear infinite; }
@keyframes flick { 0%,100% { opacity: 1 } 47% { opacity: .94 } 48% { opacity: 1 } 83% { opacity: .97 } }
@keyframes blink { 50% { opacity: 0 } }
@keyframes led { 0%,100% { opacity: 1 } 92% { opacity: .25 } }
@keyframes appear { from { opacity: 0 } to { opacity: 1 } }
@keyframes power { 0% { opacity: 0 } 10% { opacity: 1 } 18% { opacity: .2 } 30% { opacity: 1 } 38% { opacity: .5 } 50%,100% { opacity: 1 } }
@keyframes roll { from { transform: translateY(-120px) } to { transform: translateY(var(--h)) } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
    <rect y="2" width="4" height="1" fill="#000" opacity=".16"/>
  </pattern>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".55"/>
  </radialGradient>
  <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFB547" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FFB547" stop-opacity=".05"/>
    <stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="tube"><rect width="900" height="46" rx="6"/></clipPath>
</defs>
<g clip-path="url(#tube)">
  <rect width="900" height="46" fill="#120D08"/>
  <g class="crt">
<text x="24" y="29" font-size="14" class="txt" ><tspan class="amb">0ph1s@core</tspan><tspan class="dim">:~$ </tspan><tspan class="txt">git log --author=0ph1s</tspan></text>
<rect class="blink" x="334.8" y="17" width="8.4" height="15" fill="#FFB547" />
<text x="876" y="29" font-size="12" class="dim" text-anchor="end">6 canais</text>
  </g>
  <rect class="roll" style="--h:166px" width="900" height="120" fill="url(#band)"/>
  <rect width="900" height="46" fill="url(#scan)"/>
  <rect width="900" height="46" fill="url(#vig)"/>
</g>
<rect x=".5" y=".5" width="899" height="45" rx="6" fill="none" stroke="#5A3B1F"/>
</svg>
