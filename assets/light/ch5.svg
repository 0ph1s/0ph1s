<svg xmlns="http://www.w3.org/2000/svg" width="440" height="196" viewBox="0 0 440 196" role="img" aria-label="Aviônica de UAV em Haskell: Máquina de estados de aviônica com CREM e um simulador puro. Iniciação científica na FATEC.">
<style>
text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
.dim { fill: #59636e; } .amb { fill: #0969da; } .hot { fill: #1f2328; } .usr { fill: #1a7f37; }
.txt { fill: #1f2328; } .wire { fill: #d1d9e0; } .glass { fill: #ffffff; } .status { fill: #59636e; }
.glow { filter: url(#glow); }
.crt { animation: flick 6s steps(1) infinite; }
.blink { animation: blink 1.06s steps(1) infinite; }
.led { animation: led 2.4s steps(1) infinite; }
.a { animation: appear .01s linear both; }
.on { animation: power .5s linear both; }
.roll { animation: roll 8s linear infinite; }
@keyframes flick { 0%,100% { opacity: 1 } 47% { opacity: .94 } 48% { opacity: 1 } 83% { opacity: .97 } }
@keyframes blink { 50% { opacity: 0 } }
@keyframes led { 0%,100% { opacity: 1 } 92% { opacity: .25 } }
@keyframes appear { from { opacity: 0 } to { opacity: 1 } }
@keyframes power { 0% { opacity: 0 } 10% { opacity: 1 } 18% { opacity: .2 } 30% { opacity: 1 } 38% { opacity: .5 } 50%,100% { opacity: 1 } }
@keyframes roll { from { transform: translateY(-120px) } to { transform: translateY(var(--h)) } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
    
    <feMerge><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
    <rect y="2" width="4" height="1" fill="#000" opacity=".16"/>
  </pattern>
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".55"/>
  </radialGradient>
  <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0969da" stop-opacity="0"/>
    <stop offset=".5" stop-color="#0969da" stop-opacity=".05"/>
    <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="tube"><rect width="440" height="196" rx="6"/></clipPath>
</defs>
<g clip-path="url(#tube)">
  <rect width="440" height="196" fill="#ffffff"/>
  <g class="">
<rect x="0" y="0" width="440" height="30" fill="#f6f8fa"/>
<line x1="0" y1="30.5" x2="440" y2="30.5" stroke="#e6eaef"/>
<text x="16" y="20" font-size="13" class="amb glow" font-weight="700">CH5</text>
<text x="58" y="20" font-size="12" class="dim" >pesquisa / ic</text>
<rect class="blink" x="378" y="14" width="7" height="7" fill="#1a7f37"/>
<text x="424" y="21" font-size="12" class="dim" text-anchor="end">live</text>
<text x="16" y="60" font-size="17" class="hot glow" >Aviônica de UAV em Haskell</text>
<text x="16" y="84" font-size="12" class="txt" >Máquina de estados de aviônica com CREM e um simulador</text>
<text x="16" y="101" font-size="12" class="txt" >puro. Iniciação científica na FATEC.</text>
<line x1="16" y1="138" x2="424" y2="138" stroke="#d1d9e0" stroke-dasharray="3 3"/>
<text x="16" y="158" font-size="12" class="amb" ><tspan class="dim">stack </tspan>haskell</text>
<text x="424" y="158" font-size="12" class="amb" text-anchor="end" opacity=".7">▅▅▇▇▃▃▅▅▇▇▃▃</text>
<text x="16" y="182" font-size="12" class="amb" font-weight="700">&gt; OPEN_REPO ↗</text>
<text x="424" y="182" font-size="11" class="dim" text-anchor="end">0ph1s/avionics-crem</text>
  </g>
</g>
<rect x=".5" y=".5" width="439" height="195" rx="6" fill="none" stroke="#d1d9e0"/>
</svg>
